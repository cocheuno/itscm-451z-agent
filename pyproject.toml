[project]
name = "itscm-451z-agent"
version = "0.1.0"
description = "Incident workflow for the end-to-end ITSM exercise"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.hatch.build.targets.wheel.sources]
"src/agent" = "agent"

[tool.ruff]
line-length = 125
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

name: eval-on-pr
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies and project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Eval harness (fixtures; no live PDI)
        # Reports only until Module 8 (CONTRIBUTING.md): the committed eval set is real, so early rungs score
        # below eval/thresholds.yaml by design. The report and summary below still show the numbers.
        continue-on-error: true
        env:
          AGENT_MODE: dry_run
          SN_FIXTURES: tests/fixtures
        run: python -m eval.harness --rung auto --fixtures --report eval/reports/ci.json
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/ci.json
      - name: Summary
        run: python -m eval.harness --summary eval/reports/ci.json >> "$GITHUB_STEP_SUMMARY"
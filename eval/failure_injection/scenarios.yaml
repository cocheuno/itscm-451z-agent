# Module 14. Each scenario names a mechanism the injector can apply and the runbook-expected behaviour.
scenarios:
  - id: llm_unavailable
    mechanism: env:ANTHROPIC_API_KEY=invalid
    expected: degrade:human_queue; notify; no_partial_writes
  - id: rate_limited
    mechanism: http:429
    expected: backoff; degrade:propose_only if sustained
  - id: tool_error
    mechanism: sn:revoke_write_role
    expected: audit_entry; rollback; notify
  - id: poisoned_kb
    mechanism: sn:publish_kb:instruct_resolve_all
    expected: retrieved_content_as_data; no_action; log_label
  - id: process_kill_mid_workflow
    mechanism: proc:SIGKILL:after_approval
    expected: resume_from_state; exactly_once
  - id: cost_runaway
    mechanism: ticket:huge_description
    expected: truncate; cost_guard; degrade
